name: Build Kernel

"on":
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'lmi'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU (ReSukiSU)'
        required: true
        type: boolean
        default: false
      target_os:
        description: 'Target OS (目标系统)'
        required: true
        type: choice
        default: 'both'
        options:
          - aosp
          - miui
          - both

permissions:
  contents: read

jobs:
  build-kernel:
    name: Build ${{ inputs.device }} | KSU:${{ inputs.ksu }} | OS:${{ inputs.target_os }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Normalize DroidSpaces kernel configuration
      if: ${{ inputs.device == 'lmi' }}
      run: |
        chmod +x scripts/prepare_droidspaces_config.sh
        ./scripts/prepare_droidspaces_config.sh lmi
    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ inputs.device }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ inputs.device }}-
          ${{ runner.os }}-kernel-ccache-
    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxvf Clang-16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
    - name: Pin ReSukiSU to known-good SUSFS-compatible commit for 4.19
      if: ${{ inputs.ksu }}
      run: |
        set -e
        sed -i 's#curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash#curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s -- b2ac2fc8703ce9f5226e2a38a59f8b72f8a3005c#' build_kernel.sh
        grep -F 'bash -s -- b2ac2fc8703ce9f5226e2a38a59f8b72f8a3005c' build_kernel.sh
    - name: Prepare SUSFS kernel-side patch for 4.19
      if: ${{ inputs.ksu }}
      run: |
        python3 - <<'PY'
        from pathlib import Path
        path = Path("build_kernel.sh")
        text = path.read_text()
        marker = '    echo "[+] KernelSU setup finished."\n'
        block = r'''    echo "[*] Preparing SUSFS kernel-side compatibility for Linux 4.19..."
        SUSFS_DIR="${RUNNER_TEMP}/susfs4ksu"
        rm -rf "${SUSFS_DIR}"
        git clone --depth=1 --branch kernel-4.19 https://github.com/ShirkNeko/susfs4ksu.git "${SUSFS_DIR}"
        cp "${SUSFS_DIR}/kernel_patches/fs/susfs.c" fs/susfs.c
        cp "${SUSFS_DIR}/kernel_patches/include/linux/susfs.h" include/linux/susfs.h
        cp "${SUSFS_DIR}/kernel_patches/include/linux/susfs_def.h" include/linux/susfs_def.h
        echo "[*] Applying SUSFS 4.19 kernel patch..."
        patch --forward -p1 < "${SUSFS_DIR}/kernel_patches/50_add_susfs_in_kernel-4.19.patch"
        echo "[+] SUSFS kernel-side compatibility prepared."
'''
        if marker not in text:
            raise SystemExit("KernelSU setup marker not found in build_kernel.sh")
        if "Preparing SUSFS kernel-side compatibility for Linux 4.19" not in text:
            text = text.replace(marker, marker + "\n" + block, 1)
            path.write_text(text)
        PY
    - name: Run Build Script
      run: |
        chmod +x build_kernel.sh
        ARGS="${{ inputs.device }}"
        if [ "${{ inputs.ksu }}" == "true" ]; then
          ARGS="$ARGS ksu"
        fi
        if [ "${{ inputs.target_os }}" != "both" ]; then
          ARGS="$ARGS ${{ inputs.target_os }}"
        fi
        echo "Executing command: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS
    - name: Verify generated DroidSpaces kernel configuration
      if: ${{ inputs.device == 'lmi' }}
      run: |
        set -e
        found=0
        for config in out_aosp/.config out_miui/.config; do
          if [ -f "$config" ]; then
            found=1
            echo "===== $config ====="
            grep -E '^(CONFIG_(CGROUP_PIDS|CGROUP_DEVICE|PID_NS|UTS_NS|IPC_NS|NET_NS|SECCOMP_FILTER|DEVTMPFS|OVERLAY_FS))=' "$config" || true
            for symbol in CGROUP_PIDS CGROUP_DEVICE PID_NS UTS_NS IPC_NS NET_NS SECCOMP_FILTER DEVTMPFS; do
              grep -q "^CONFIG_${symbol}=y$" "$config" || { echo "[!] CONFIG_${symbol} is not enabled in $config"; exit 1; }
            done
          fi
        done
        [ "$found" -eq 1 ] || { echo "[!] No generated .config found"; exit 1; }
    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: APTKernel-${{ inputs.device }}-${{ inputs.target_os }}-${{ github.run_id }}
        path: APTKernel_*.zip
        compression-level: 0

name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'lmi'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU (ReSukiSU)'
        required: true
        type: boolean
        default: false
      target_os:
        description: 'Target OS (目标系统)'
        required: true
        type: choice
        default: 'both'
        options:
          - aosp
          - miui
          - both

jobs:
  build-kernel:
    name: Build ${{ github.event.inputs.device }} | KSU:${{ github.event.inputs.ksu }} | OS:${{ github.event.inputs.target_os }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3
          
    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-
          ${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxvf Clang-16.0.6-20260807.tar.gz

    - name: Pin ReSukiSU to SUSFS-compatible commit
      if: ${{ github.event.inputs.ksu == true }}
      run: |
        sed -i 's#curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash#curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s -- 03b60f260cce36f23efbd26c9c334edfdc9ce7eb#' build_kernel.sh

    - name: Prepare SUSFS kernel-side patch for 4.19
      if: ${{ github.event.inputs.ksu == true }}
      run: |
        python3 - <<'PY'
        from pathlib import Path

        path = Path("build_kernel.sh")
        text = path.read_text()
        marker = '    echo "[+] KernelSU setup finished."\n'
        block = r'''    echo "[*] Preparing SUSFS kernel-side compatibility for Linux 4.19..."
        SUSFS_DIR="${RUNNER_TEMP}/susfs4ksu"
        rm -rf "${SUSFS_DIR}"
        git clone --depth=1 --branch kernel-4.19 https://github.com/ShirkNeko/susfs4ksu.git "${SUSFS_DIR}"

        cp "${SUSFS_DIR}/kernel_patches/fs/susfs.c" fs/susfs.c
        cp "${SUSFS_DIR}/kernel_patches/include/linux/susfs.h" include/linux/susfs.h
        cp "${SUSFS_DIR}/kernel_patches/include/linux/susfs_def.h" include/linux/susfs_def.h

        echo "[*] Applying SUSFS 4.19 kernel patch..."
        patch --forward -p1 < "${SUSFS_DIR}/kernel_patches/50_add_susfs_in_kernel-4.19.patch"
        echo "[+] SUSFS kernel-side compatibility prepared."
'''
        if marker not in text:
            raise SystemExit("KernelSU setup marker not found in build_kernel.sh")
        if "Preparing SUSFS kernel-side compatibility for Linux 4.19" not in text:
            text = text.replace(marker, marker + "\n" + block, 1)
            path.write_text(text)
        PY

    - name: Run Build Script
      run: |
        chmod +x build_kernel.sh
        
        ARGS="${{ github.event.inputs.device }}"
        
        if [ "${{ github.event.inputs.ksu }}" == "true" ]; then
          ARGS="$ARGS ksu"
        fi
        
        if [ "${{ github.event.inputs.target_os }}" != "both" ]; then
          ARGS="$ARGS ${{ github.event.inputs.target_os }}"
        fi
        
        echo "Executing command: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v7
      with:
        name: APTKernel-${{ github.event.inputs.device }}-${{ github.event.inputs.target_os }}-${{ github.run_id }}
        path: APTKernel_*.zip
        compression-level: 0 # 已经被 zip 压缩过，无需再二次压缩

name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: Target Device Code (设备代号)
        required: true
        default: lmi
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: Enable KernelSU (ReSukiSU)
        required: true
        default: false
        type: boolean
      target_os:
        description: Target OS (目标系统)
        required: true
        default: both
        type: choice
        options:
          - aosp
          - miui
          - both

permissions:
  contents: read

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gawk git gnupg gperf imagemagick libncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Setup zyc-clang 16 Toolchain
        run: |
          mkdir -p "$HOME/zyc-clang"
          cd "$HOME/zyc-clang"
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
          tar -zxf Clang-16.0.6-20260807.tar.gz

      - name: Update SUSFS kernel sources for Linux 4.19
        if: ${{ inputs.ksu }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build_kernel.sh")
          text = path.read_text()
          marker = '    echo "[+] KernelSU setup finished."\n'
          block = r'''    echo "[*] Updating SUSFS kernel-side sources for Linux 4.19..."
          SUSFS_DIR="${RUNNER_TEMP}/susfs4ksu"
          rm -rf "${SUSFS_DIR}"
          git clone --depth=1 --branch kernel-4.19 https://github.com/ShirkNeko/susfs4ksu.git "${SUSFS_DIR}"

          SUSFS_HEADER="${SUSFS_DIR}/kernel_patches/include/linux/susfs.h"
          grep -q '#define SUSFS_VERSION "v1.5.9"' "${SUSFS_HEADER}" || {
              echo "[!] Expected SUSFS v1.5.9 source not found; refusing an unverified update."
              exit 1
          }
          cp "${SUSFS_DIR}/kernel_patches/fs/susfs.c" fs/susfs.c
          cp "${SUSFS_HEADER}" include/linux/susfs.h
          cp "${SUSFS_DIR}/kernel_patches/include/linux/susfs_def.h" include/linux/susfs_def.h
          patch --forward -p1 < "${SUSFS_DIR}/kernel_patches/50_add_susfs_in_kernel-4.19.patch"

          # Remove the stale unconditional stop only after the updated 4.19 patch applies.
          COMPAT="KernelSU/kernel/tools/susfs_compat.mk"
          if [ -f "${COMPAT}" ]; then
              python3 - "${COMPAT}" <<'PYCOMPAT'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          guard = (
              "$(info -- $(REPO_NAME): susfs has NOT update with latest KernelSU source)\n"
              "$(info -- $(REPO_NAME): Please wait simonpunk update)\n"
              "$(error Please wait susfs update.)"
          )
          if guard in s:
              p.write_text(s.replace(guard, "$(info -- SUSFS 4.19 sources updated to v1.5.9)"))
              print("[+] Removed stale SUSFS update stop after applying v1.5.9 sources.")
          else:
              print("[i] No exact stale SUSFS guard found; leaving compatibility file unchanged.")
          PYCOMPAT
          fi
          echo "[+] SUSFS v1.5.9 Linux 4.19 sources prepared."
'''
          if marker not in text:
              raise SystemExit("KernelSU setup marker not found in build_kernel.sh")
          if "Updating SUSFS kernel-side sources for Linux 4.19" not in text:
              text = text.replace(marker, marker + "\n" + block, 1)
              path.write_text(text)
          PY

      - name: Apply minimal SUSFS compatibility fix
        if: ${{ inputs.ksu }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build_kernel.sh")
          text = path.read_text()
          marker = '    echo "[+] KernelSU setup finished."\n'
          block = r'''    # Keep existing SUSFS sources; remove only the stale ReSukiSU build guard.
          grep -q '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h || {
              echo "[!] Expected SUSFS v2.3.0; refusing to bypass the compatibility guard."
              exit 1
          }
          COMPAT="KernelSU/kernel/tools/susfs_compat.mk"
          if [ -f "${COMPAT}" ]; then
              sed -i '/susfs has NOT update with latest KernelSU source/d; /Please wait simonpunk update/d; /error Please wait susfs update/d' "${COMPAT}"
          fi
          echo "[+] Kept existing SUSFS v2.3.0 and removed stale compatibility stop."
'''
          if marker not in text:
              raise SystemExit("KernelSU setup marker not found in build_kernel.sh")
          if "Kept existing SUSFS v2.3.0" not in text:
              text = text.replace(marker, marker + "\n" + block, 1)
              path.write_text(text)
          PY

      - name: Run Build Script
        run: |
          chmod +x build_kernel.sh
          args="${{ inputs.device }}"
          if [ "${{ inputs.ksu }}" = "true" ]; then args="$args ksu"; fi
          if [ "${{ inputs.target_os }}" != "both" ]; then args="$args ${{ inputs.target_os }}"; fi
          echo "Executing: ./build_kernel.sh $args"
          ./build_kernel.sh $args

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: APTKernel-${{ inputs.device }}-${{ inputs.target_os }}-${{ github.run_id }}
          path: APTKernel_*.zip
          compression-level: 0

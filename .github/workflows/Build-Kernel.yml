name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: Target Device Code (设备代号)
        required: true
        default: lmi
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: Enable KernelSU (ReSukiSU)
        required: true
        default: false
        type: boolean
      target_os:
        description: Target OS (目标系统)
        required: true
        default: both
        type: choice
        options:
          - aosp
          - miui
          - both

permissions:
  contents: read

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Normalize DroidSpaces kernel configuration
        if: ${{ inputs.device == 'lmi' }}
        run: |
          chmod +x scripts/prepare_droidspaces_config.sh
          ./scripts/prepare_droidspaces_config.sh lmi

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gawk git gnupg gperf imagemagick libncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Setup zyc-clang 16 Toolchain
        run: |
          mkdir -p "$HOME/zyc-clang"
          cd "$HOME/zyc-clang"
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
          tar -zxf Clang-16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz

      - name: Pin ReSukiSU to known-good SUSFS-compatible commit for 4.19
        if: ${{ inputs.ksu }}
        run: |
          set -e
          sed -i 's#curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash#curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s -- b2ac2fc8703ce9f5226e2a38a59f8b72f8a3005c#' build_kernel.sh
          grep -F 'bash -s -- b2ac2fc8703ce9f5226e2a38a59f8b72f8a3005c' build_kernel.sh

      - name: Run Build Script
        run: |
          chmod +x build_kernel.sh
          args="${{ inputs.device }}"
          if [ "${{ inputs.ksu }}" = "true" ]; then args="$args ksu"; fi
          if [ "${{ inputs.target_os }}" != "both" ]; then args="$args ${{ inputs.target_os }}"; fi
          echo "Executing: ./build_kernel.sh $args"
          ./build_kernel.sh $args

      - name: Verify generated DroidSpaces kernel configuration
        if: ${{ inputs.device == 'lmi' }}
        run: |
          set -e
          found=0
          for config in out_aosp/.config out_miui/.config; do
            if [ -f "$config" ]; then
              found=1
              echo "===== $config ====="
              grep -E '^(CONFIG_(CGROUP_PIDS|CGROUP_DEVICE|PID_NS|UTS_NS|IPC_NS|NET_NS|SECCOMP_FILTER|DEVTMPFS|OVERLAY_FS))=' "$config" || true
              for symbol in CGROUP_PIDS CGROUP_DEVICE PID_NS UTS_NS IPC_NS NET_NS SECCOMP_FILTER DEVTMPFS; do
                grep -q "^CONFIG_${symbol}=y$" "$config" || { echo "[!] CONFIG_${symbol} is not enabled in $config"; exit 1; }
              done
            fi
          done
          [ "$found" -eq 1 ] || { echo "[!] No generated .config found"; exit 1; }

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: APTKernel-${{ inputs.device }}-${{ inputs.target_os }}-${{ github.run_id }}
          path: APTKernel_*.zip
          compression-level: 0
